<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chess Move Tracker V3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fafafa;
      margin: 20px;
    }
    h1 {
      color: #2c3e50;
      margin-bottom: 10px;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(8, 80px);
      grid-template-rows: repeat(8, 80px);
      border: 3px solid #333;
      margin-bottom: 10px;
      max-width: 640px;
    }
    .square {
      width: 80px;
      height: 80px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      box-sizing: border-box;
    }
    .light { background: #f0d9b5; }
    .dark  { background: #b58863; }

    .piece-img {
      width: 72px;
      height: 72px;
      pointer-events: none;
    }

    .coord {
      position: absolute;
      bottom: 2px;
      left: 4px;
      font-size: 11px;
      color: rgba(0,0,0,0.7);
      text-shadow: 0 0 2px rgba(255,255,255,0.8);
      pointer-events: none;
    }

    /* Lichess-style selection highlights */
    .source-selected { box-shadow: inset 0 0 0 4px #f7ec5d; }
    .dest-selected   { box-shadow: inset 0 0 0 4px #f2b233; }

    #controls {
      margin-bottom: 10px;
      max-width: 640px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    button {
      padding: 6px 10px;
      background: #2c3e50;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 14px;
      border-radius: 3px;
    }
    button:hover { background: #1b2836; }

    #emailInput {
      flex: 1 1 160px;
      min-width: 140px;
      padding: 5px;
      font-size: 14px;
    }

    #moves {
      width: 100%;
      max-width: 640px;
      height: 200px;
      box-sizing: border-box;
    }

    @media (max-width: 700px) {
      #board { width: 100%; max-width: 100%; }
      .square    { width: 12.5vw; height: 12.5vw; }
      .piece-img { width: 11vw;   height: 11vw;   }
    }
  </style>

  <!--
    Class load order — each file may use only classes defined in earlier files:

      constants.js   ChessConstants   pure static helpers; no deps
      state.js       ChessState       mutable data; uses ChessConstants
      board.js       BoardRenderer    DOM rendering; uses ChessConstants + ChessState
      pgn.js         PGNManager       PGN output; uses ChessState
      moves.js       MoveHandler      game logic; uses all of the above
      game.js        ChessApp         wires everything; creates window.app on load
  -->
  <script src="constants.js"></script>
  <script src="state.js"></script>
  <script src="board.js"></script>
  <script src="pgn.js"></script>
  <script src="moves.js"></script>
  <script src="game.js"></script>
</head>

<body>
  <h1>Chess Move Tracker</h1>

  <div id="board"></div>

  <div id="controls">
    <!--
      All buttons delegate to the global `app` instance created by game.js.
      By the time any button can be clicked, window.onload has already run
      and window.app is fully initialised.
    -->
    <button onclick="app.newGame()">New Game</button>
    <button onclick="app.flipBoard()">Flip Board</button>
    <button onclick="app.copyPGN()">Copy PGN</button>
    <input  id="emailInput" type="text" placeholder="Email to (comma-separated)">
    <button onclick="app.sendEmail()">Send PGN</button>
  </div>

  <h3>PGN Output</h3>
  <textarea id="moves"></textarea>
</body>
</html>
