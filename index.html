<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8">
  <title>Chess Game Recorder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fafafa;
      margin: 20px;
    }
    h1 {
      color: #2c3e50;
      margin-bottom: 10px;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(8, 80px);
      grid-template-rows: repeat(8, 80px);
      border: 3px solid #333;
      margin-bottom: 10px;
      max-width: 640px;
    }
    .square {
      width: 80px;
      height: 80px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      box-sizing: border-box;
    }
    .light { background: #f0d9b5; }
    .dark  { background: #b58863; }

    .piece-img {
      width: 72px;
      height: 72px;
      pointer-events: none;
    }

    .coord {
      position: absolute;
      bottom: 2px;
      left: 4px;
      font-size: 11px;
      color: rgba(0,0,0,0.7);
      text-shadow: 0 0 2px rgba(255,255,255,0.8);
      pointer-events: none;
    }

    /* Lichess-style selection highlights */
    .source-selected { box-shadow: inset 0 0 0 4px #f7ec5d; }
    .dest-selected   { box-shadow: inset 0 0 0 4px #f2b233; }

    #controls {
      margin-bottom: 10px;
      max-width: 640px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    button {
      padding: 6px 10px;
      background: #2c3e50;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 14px;
      border-radius: 3px;
    }
    button:hover { background: #1b2836; }

    #emailInput {
      flex: 1 1 160px;
      min-width: 140px;
      padding: 5px;
      font-size: 14px;
    }

    #moves {
      width: 100%;
      max-width: 640px;
      height: 200px;
      box-sizing: border-box;
    }

    @media (max-width: 700px) {
      body { margin: 8px; }
      #board {
        width: calc(100vw - 16px);
        max-width: calc(100vw - 16px);
        grid-template-columns: repeat(8, calc((100vw - 16px) / 8));
        grid-template-rows:    repeat(8, calc((100vw - 16px) / 8));
      }
      .square {
        width:  calc((100vw - 16px) / 8);
        height: calc((100vw - 16px) / 8);
      }
      .piece-img {
        width:  calc((100vw - 16px) / 8 - 4px);
        height: calc((100vw - 16px) / 8 - 4px);
      }
    }

    /* ── Result & Name dialogs ──────────────────────────────────────── */
    #resultOverlay, #namesOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #resultOverlay.open, #namesOverlay.open { display: flex; }

    #resultDialog {
      background: #fff;
      border: 2px solid #2c3e50;
      border-radius: 6px;
      padding: 28px 32px;
      min-width: 280px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    #resultDialog h2 {
      margin: 0 0 8px;
      font-size: 18px;
      color: #2c3e50;
    }
    #resultDialog p {
      margin: 0 0 20px;
      font-size: 14px;
      color: #555;
    }
    .result-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .result-btn {
      padding: 9px 18px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      min-width: 80px;
    }
    .result-btn.white-wins { background: #f0d9b5; color: #2c3e50; border: 1px solid #b58863; }
    .result-btn.black-wins { background: #b58863; color: #fff; }
    .result-btn.draw       { background: #7f8c8d; color: #fff; }
    .result-btn:hover { filter: brightness(1.1); }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <script>
    // Cache-bust all JS files so browsers always load the latest version.
    const version = Date.now();
    ["constants.js", "state.js", "board.js", "pgn.js", "moves.js", "game.js"]
      .forEach(file => {
        const s = document.createElement("script");
        s.src = file + "?v=" + version;
        s.async = false; // Forces sequential file execution order
        document.head.appendChild(s);
      });
  </script>
</head>

<body>
  <h1>Chess Game Recorder</h1>

  <div id="board"></div>

  <div id="controls">
    <button onclick="app.newGame()">New Game</button>
    <button onclick="app.flipBoard()">Flip Board</button>
    <button onclick="app.copyPGN()">Copy PGN</button>
    <input  id="emailInput" type="text" placeholder="Email to (comma-separated)">
    <button onclick="app.sendEmail()">Send PGN</button>
  </div>

  <h3>PGN Output</h3>
  <textarea id="moves"></textarea>

  <div id="resultOverlay">
    <div id="resultDialog">
      <h2>Game in Progress</h2>
      <p>Record the result before starting a new game:</p>
      <div class="result-buttons">
        <button class="result-btn white-wins" onclick="app.finishGame('1-0')">1-0</button>
        <button class="result-btn draw"       onclick="app.finishGame('1/2-1/2')">½-½</button>
        <button class="result-btn black-wins" onclick="app.finishGame('0-1')">0-1</button>
      </div>
    </div>
  </div>

  <div id="namesOverlay">
    <div id="resultDialog">
      <h2>Enter Player Names</h2>
      <p>Set names for the upcoming game:</p>
      <div style="margin-bottom: 14px; text-align: left;">
        <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #2c3e50;">White Player:</label>
        <input id="whiteInput" type="text" style="width: 100%; padding: 6px; box-sizing: border-box; font-size: 14px;">
      </div>
      <div style="margin-bottom: 22px; text-align: left;">
        <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #2c3e50;">Black Player:</label>
        <input id="blackInput" type="text" style="width: 100%; padding: 6px; box-sizing: border-box; font-size: 14px;">
      </div>
      <button class="result-btn draw" onclick="app.submitPlayerNames()">Start Game</button>
    </div>
  </div>
</body>
</html>
